# Add a link to every pushed commit that opens playground based on that commit.

name: Playground preview

on:
  push:
    # Every push.
    branches: ["**"]

    # Ignore README.md changes.
    paths-ignore: ["**/*.md"]

  # For manual runs
  workflow_dispatch:
    inputs:
      moodle-branch:
        description: "Which Moodle version to boot."
        type: choice
        default: MOODLE_500_STABLE
        options: [MOODLE_500_STABLE, MOODLE_405_STABLE, MOODLE_404_STABLE]
      restore-database-url:
        description: "URL of a .sq3 snapshot - restores a full site. Blank = empty Moodle"
        type: string
        default: ""
      restore-database-sha256:
        description: "Optional sha256 checksum of restore database."
        type: string
        default: ""
      teachers:
        description: "Num editing teachers in REVIEW course. 0 = admin sign-in."
        type: choice
        default: "1"
        options: ["1", "0", "2"]
      students:
        description: "Num students in REVIEW course"
        type: choice
        default: "1"
        options: ["1", "2", "3", "5", "10", "20"]
      courses:
        description: "Num courses to build. You are enrolled in the 2, not 3"
        type: choice
        default: "1"
        options: ["1", "2", "3"]
      sections:
        description: "Num sections in REVIEW course"
        type: choice
        default: "3"
        options: ["1", "3", "5", "10"]
      course-format:
        description: "Course format for REVIEW course. (default) = topics."
        type: choice
        default: "(default)"
        options: ["(default)", topics, weeks, social, singleactivity]
      login-as:
        description: "Sign-in user. (default) = derived from the landing page."
        type: choice
        default: "(default)"
        options: ["(default)", admin, teacher, teacher2, student1, student2, student3]
      theme:
        description: "Theme. Blank = boost. owner/repo@ref#component e.g. moodle-an-hochschulen/moodle-theme_boost_union@MOODLE_405_STABLE#theme_boost_union"
        type: string
        default: ""
      extra-plugins:
        description: "Extra plugins. Up to 5, comma separated. owner/repo@ref#component e.g. ucl-isd/moodle-local_sitsgradepush@main#local_sitsgradepush"
        type: string
        default: ""
      language-packs:
        description: "Language packs. Max 3, comma separated. e.g. en,fr,es"
        type: string
        default: ""
      sample-content:
        description: "Select review-course for a ready-made course with ten activities."
        type: choice
        default: "(default)"
        options: ["(default)", review-course]
      restore-course-url:
        description: "URL of a Moodle course backup (.mbz) to restore, e.g. https://example.ac.uk/course.mbz. Blank = an empty course."
        type: string
        default: ""
      php-version:
        description: "PHP version. (default) = decided by the Moodle branch."
        type: choice
        default: "(default)"
        options: ["(default)", "8.1", "8.2", "8.3", "8.4"]
      landing-path:
        description: "Landing page. e.g. /course/view.php?name=cwdemo. Blank = default for the plugin type."
        type: string
        default: ""
      plugin-component:
        description: "Component name. e.g. mod_coursework. Blank = read from version.php."
        type: string
        default: ""
      data-hosts:
        description: "Additional permitted hosts, comma separated. Blank = github.com,raw.githubusercontent.com"
        type: string
        default: ""

permissions:
  contents: read

  # Permission to create the link.
  statuses: write

  # Permission to create the PR comment.
  pull-requests: write

concurrency:
  group: playground-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Don't run on branch deletion
    if: github.event.deleted != true
    steps:
      - uses: actions/checkout@v5
      - id: preview
        # Pinned deliberately: @main would let a pushed commit build its own link.
        # Must be the FULL 40-character SHA — Actions rejects a short one.
        uses: DavidUCL/githubactionsplayground/preview@77aea9adf476caccb1a8d4c3fe51c1f856bbec1c
        with:
          head-repo: ${{ github.repository }}
          head-sha: ${{ github.sha }}
          plugin-root: "."
          moodle-branch: ${{ inputs.moodle-branch || 'MOODLE_405_STABLE' }}
          restore-database-url: ${{ inputs.restore-database-url || 'https://raw.githubusercontent.com/DavidUCL/mchef-urls/7ee431a4cd78f5f44c75d8f5fc07d3a668fe2b5f/data/coursework-demo-MOODLE_405_STABLE.sq3' }}
          restore-database-sha256: ${{ inputs.restore-database-sha256 || 'e73479e590aab30c3a3abc8eed07398f615ca2574e2cf4d052f3bf563ac8409c' }}
          teachers: ${{ inputs.teachers }}
          students: ${{ inputs.students }}
          courses: ${{ inputs.courses }}
          sections: ${{ inputs.sections }}
          course-format: ${{ inputs.course-format }}
          login-as: ${{ inputs.login-as || 'admin' }}
          theme: ${{ inputs.theme }}
          extra-plugins: ${{ inputs.extra-plugins }}
          language-packs: ${{ inputs.language-packs }}
          sample-content: ${{ inputs.sample-content }}
          restore-course-url: ${{ inputs.restore-course-url }}
          php-version: ${{ inputs.php-version }}
          landing-path: ${{ inputs.landing-path || '/course/view.php?name=cwdemo' }}
          plugin-component: ${{ inputs.plugin-component }}
          data-hosts: ${{ inputs.data-hosts }}

      - name: Publish the preview as a commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.preview-url }}
          USER_NAME: ${{ steps.preview.outputs.preview-user }}
        run: |
          set -euo pipefail
          if [ -n "$URL" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=success \
              -f context="Moodle Playground preview" \
              -f description="Opens this commit in a browser Moodle as $USER_NAME" \
              -f target_url="$URL" >/dev/null
          else
            # No link. Report issue but don't fail the commit
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=success \
              -f context="Moodle Playground preview" \
              -f description="No preview — this commit cannot boot in the playground" \
              >/dev/null
          fi

      # Pull request comment.
      - name: Comment on any open pull request for this commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.preview.outputs.comment-body }}
        run: |
          set -euo pipefail
          if [ -z "${BODY:-}" ]; then
            echo "::notice::no comment body was produced."
            exit 0
          fi
          # A commit can belong to more than one open PR.
          prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                  --jq '.[] | select(.state == "open") | .number' || true)
          [ -n "$prs" ] || { echo "::notice::no open PR contains this commit"; exit 0; }
          for pr in $prs; do
            # Re-check the head: a newer push may have landed while this ran,
            # and its comment must not be overwritten by this older one.
            head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::PR #$pr head moved to ${head:0:7}; leaving its comment alone"
              continue
            fi
            found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments?per_page=100" \
              --jq '.[] | select(.user.type == "Bot")
                        | select((.body // "") | contains("<!-- moodle-playground-preview -->")) | .id')
            id=${found%%$'\n'*}
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$BODY" >/dev/null
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f body="$BODY" >/dev/null
            fi
          done
